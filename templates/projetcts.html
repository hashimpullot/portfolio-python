{% extends "base.html" %}

{% block content %}
<h2 class="section">Selected Work</h2>

<div class="projects">
    {% for project in projects %}
    <div class="project-card">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <a href="{{ project.link }}" target="_blank">View →</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
